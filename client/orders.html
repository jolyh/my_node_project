<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Page</title>
    <link rel="stylesheet" href="/client/css/global.css">
</head>
<body>
    <header>
        <h1>Orders</h1>
    </header>

    <main>
        <section class="card card-wide">
            <h2>Order actions</h2>

            <div class="form-actions">
                <button id="list-orders" class="btn btn-primary">List all orders</button>
            </div>

            <div class="form-group">
                <label for="orderId">Order ID</label>
                <input id="orderId" placeholder="e.g. 1" />
                <div class="form-actions">
                    <button id="get-order" class="btn">Get order by ID</button>
                    <button id="delete-order" class="btn btn-danger">Delete order</button>
                </div>
            </div>

            <div class="form-group">
                <label for="userId">User ID</label>
                <input id="userId" placeholder="e.g. 1" />
                <div class="form-actions">
                    <button id="get-user-orders" class="btn">Get orders by user ID</button>
                    <button id="create-order" class="btn">Create order for user</button>
                    <button id="delete-user-order" class="btn btn-danger">Delete order for user</button>
                </div>
            </div>

            <div class="form-group">
                <label for="orderDate">Order delivery date</label>
                <input id="orderDate" placeholder="2026-08-20" />
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input id="description" placeholder="Order description" />
            </div>

            <p id="status-message" class="message message-success" hidden></p>
        </section>

        <section class="card card-wide">
            <h2>Orders</h2>
            <ul id="orders-list" class="list"></ul>
            <p id="empty-orders">No orders found.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 My Node Project. All rights reserved.</p>
    </footer>

    <script src="/client/assets/scripts/api.js"></script>
    <script nonce="%%CSP_NONCE%%">
        const orderIdInput = document.querySelector("#orderId");
        const userIdInput = document.querySelector("#userId");
        const ordersList = document.querySelector("#orders-list");
        const emptyOrders = document.querySelector("#empty-orders");
        const statusMessage = document.querySelector("#status-message");
        let orders = [];

        const setStatus = (message, type = "success") => {
            statusMessage.textContent = message;
            statusMessage.className = `message message-${type}`;
            statusMessage.hidden = !message;
        };

        const renderOrders = () => {
            ordersList.replaceChildren(...orders.map((order) => {
                const item = document.createElement("li");
                item.className = "list-item";
                const details = document.createElement("span");
                details.textContent = `#${order.id} - User #${order.user_id} - ${order.description} - ${order.created_at} - Delivery: ${order.order_date}`;
                const actions = document.createElement("span");
                actions.className = "form-actions";
                const getButton = document.createElement("button");
                getButton.className = "btn";
                getButton.textContent = "Get";
                getButton.addEventListener("click", () => getOrderById(order.id));
                const deleteButton = document.createElement("button");
                deleteButton.className = "btn btn-danger";
                deleteButton.textContent = "Delete";
                deleteButton.addEventListener("click", () => deleteOrderById(order.id));
                actions.append(getButton, deleteButton);
                item.append(details, actions);
                return item;
            }));
            emptyOrders.hidden = orders.length > 0;
        };

        async function listOrders() {
            try {
                const result = await api.orders.list();
                orders = result.orders || [];
                renderOrders();
                setStatus(`Loaded ${orders.length} orders.`);
            } catch (error) {
                console.error("List orders failed:", error);
                setStatus("Unable to list orders.", "error");
            }
        }

        async function getOrderById(id = orderIdInput.value) {
            if (!id) return setStatus("Please enter an order ID.", "error");
            try {
                const result = await api.orders.get(id);
                orders = Array.isArray(result.order) ? result.order : [result.order];
                renderOrders();
                setStatus(`Loaded order #${id}.`);
            } catch (error) {
                console.error("Get order by ID failed:", error);
                setStatus(`Order #${id} not found.`, "error");
            }
        }

        async function getOrdersByUserId() {
            const userId = userIdInput.value;
            if (!userId) return setStatus("Please enter a user ID.", "error");
            try {
                const result = await api.users.orders(userId);
                orders = result.orders || [];
                renderOrders();
                setStatus(`Loaded orders for user #${userId}.`);
            } catch (error) {
                console.error("Get order by user ID failed:", error);
                setStatus(`No orders found for user #${userId}.`, "error");
            }
        }

        async function createOrderForUser() {
            const userId = userIdInput.value;
            if (!userId) return setStatus("Enter the user ID before creating an order.", "error");
            try {
                const result = await api.users.createOrder(userId, {
                    description: document.querySelector("#description").value || "Sample order",
                    order_date: document.querySelector("#orderDate").value || Date.now()
                });
                setStatus(`Created order #${result.order.id} for user #${userId}.`);
                await listOrders();
            } catch (error) {
                console.error("Create order failed:", error);
                setStatus("Create order failed.", "error");
            }
        }

        async function deleteOrderById(id = orderIdInput.value) {
            if (!id) return setStatus("Please enter an order ID to delete.", "error");
            try {
                await api.orders.remove(id);
                setStatus(`Deleted order #${id}.`);
                await listOrders();
            } catch (error) {
                console.error("Delete order failed:", error);
                setStatus(`Could not delete order #${id}.`, "error");
            }
        }

        async function deleteOrderForUser() {
            const userId = userIdInput.value;
            const orderId = orderIdInput.value;
            if (!userId || !orderId) return setStatus("Enter both user ID and order ID.", "error");
            try {
                await api.users.removeOrder(userId, orderId);
                setStatus(`Deleted order #${orderId} for user #${userId}.`);
                await listOrders();
            } catch (error) {
                console.error("Delete user order failed:", error);
                setStatus(`Could not delete order #${orderId} for user #${userId}.`, "error");
            }
        }

        document.querySelector("#list-orders").addEventListener("click", listOrders);
        document.querySelector("#get-order").addEventListener("click", () => getOrderById());
        document.querySelector("#delete-order").addEventListener("click", () => deleteOrderById());
        document.querySelector("#get-user-orders").addEventListener("click", getOrdersByUserId);
        document.querySelector("#create-order").addEventListener("click", createOrderForUser);
        document.querySelector("#delete-user-order").addEventListener("click", deleteOrderForUser);
        renderOrders();
    </script>
</body>
</html>
