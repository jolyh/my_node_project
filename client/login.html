<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account access</title>
    <link rel="stylesheet" href="/client/css/global.css">
</head>

<body>
    <header>
        <h1>My Node Project</h1>
    </header>
    <main>
        <section class="card auth-card">
            <div class="auth-heading">
                <p class="eyebrow">My Node Project</p>
                <h1 id="auth-title">Welcome back</h1>
                <p id="auth-description" class="auth-description">Sign in to continue.</p>
            </div>
            <div class="auth-switch" role="tablist" aria-label="Account access">
                <button id="login-tab" type="button" class="auth-switch-button active" role="tab" aria-selected="true">Log in</button>
                <button id="signup-tab" type="button" class="auth-switch-button" role="tab" aria-selected="false">Sign up</button>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required />
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-field">
                        <input id="login-password" type="password" minlength="8" autocomplete="current-password" required />
                        <button id="login-password-toggle" type="button" class="password-toggle" aria-label="Show password">Show</button>
                    </div>
                </div>
                <p id="login-error" class="message message-error" hidden></p>
                <button type="submit" class="btn btn-primary btn-block">Log in</button>
            </form>
            <form id="signup-form" hidden>
                <div class="form-group">
                    <label for="signup-name">Name</label>
                    <input id="signup-name" type="text" placeholder="Your name" autocomplete="name" required />
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input id="signup-email" type="email" placeholder="you@example.com" autocomplete="email" required />
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <div class="password-field">
                        <input id="signup-password" type="password" minlength="8" autocomplete="new-password" required />
                        <button id="signup-password-toggle" type="button" class="password-toggle" aria-label="Show password">Show</button>
                    </div>
                </div>
                <p id="signup-error" class="message message-error" hidden></p>
                <p id="signup-success" class="message message-success" hidden></p>
                <button type="submit" class="btn btn-primary btn-block">Create account</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 My Node Project. All rights reserved.</p>
    </footer>


    <script src="/client/assets/scripts/api.js"></script>
    <script nonce="%%CSP_NONCE%%">
        const loginForm = document.querySelector("#login-form");
        const signupForm = document.querySelector("#signup-form");
        const loginTab = document.querySelector("#login-tab");
        const signupTab = document.querySelector("#signup-tab");

        const setMessage = (element, message) => {
            element.textContent = message;
            element.hidden = !message;
        };

        const switchMode = (mode) => {
            const loginMode = mode === "login";
            loginForm.hidden = !loginMode;
            signupForm.hidden = loginMode;
            loginTab.classList.toggle("active", loginMode);
            signupTab.classList.toggle("active", !loginMode);
            loginTab.setAttribute("aria-selected", String(loginMode));
            signupTab.setAttribute("aria-selected", String(!loginMode));
            document.querySelector("#auth-title").textContent = loginMode ? "Welcome back" : "Create your account";
            document.querySelector("#auth-description").textContent = loginMode ? "Sign in to continue." : "Join the project with a few details.";
            setMessage(document.querySelector("#login-error"), "");
            setMessage(document.querySelector("#signup-error"), "");
            setMessage(document.querySelector("#signup-success"), "");
        };

        const bindPasswordToggle = (input, button) => {
            button.addEventListener("click", () => {
                const visible = input.type === "text";
                input.type = visible ? "password" : "text";
                button.textContent = visible ? "Show" : "Hide";
                button.setAttribute("aria-label", visible ? "Show password" : "Hide password");
            });
        };

        loginTab.addEventListener("click", () => switchMode("login"));
        signupTab.addEventListener("click", () => switchMode("signup"));
        bindPasswordToggle(document.querySelector("#login-password"), document.querySelector("#login-password-toggle"));
        bindPasswordToggle(document.querySelector("#signup-password"), document.querySelector("#signup-password-toggle"));

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            setMessage(document.querySelector("#login-error"), "");
            try {
                const result = await api.auth.login(document.querySelector("#login-email").value, document.querySelector("#login-password").value);
                console.log("Login response JSON:", result);
                window.location.href = "/users";
            } catch (error) {
                console.error("Login failed:", error);
                setMessage(document.querySelector("#login-error"), "Login failed. Check your credentials.");
            }
        });

        signupForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            setMessage(document.querySelector("#signup-error"), "");
            setMessage(document.querySelector("#signup-success"), "");
            try {
                await api.auth.signup(
                    document.querySelector("#signup-name").value,
                    document.querySelector("#signup-email").value,
                    document.querySelector("#signup-password").value
                );
                setMessage(document.querySelector("#signup-success"), "Account created successfully. You can now log in.");
                signupForm.reset();
            } catch (error) {
                console.error("Signup failed:", error);
                setMessage(document.querySelector("#signup-error"), error.message || "Signup failed. Check your details.");
            }
        });
    </script>
</body>

</html>
